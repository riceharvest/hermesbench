name: Vercel Prebuilt Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Run CI-equivalent checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Validate task inventory
        run: uv run hermesbench validate-tasks
      - name: Run unit tests
        run: uv run pytest
      - name: Build Python distributions
        run: uv build
      - name: Non-capability mock plumbing smoke
        run: |
          uv run hermesbench run --agent mock --task htu-dev-001-file-and-terminal-self-serve --output-dir /tmp/hermesbench-mock-smoke
          uv run hermesbench score /tmp/hermesbench-mock-smoke/*.json
      - uses: pnpm/action-setup@v4
        with: {version: 9}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Install website dependencies
        run: cd website && pnpm install --frozen-lockfile
      - name: Build website
        run: cd website && pnpm build
      - name: Smoke website API
        run: cd website && pnpm test:api

  deploy:
    name: Build locally and deploy prebuilt to Vercel
    needs: [validate]
    runs-on: [self-hosted, linux, x64, vercel]
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Install Vercel CLI
        run: npm install --global vercel@51.5.0

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Build prebuilt artifact locally
        run: vercel build --prod --token "$VERCEL_TOKEN"

      - name: Deploy prebuilt artifact
        run: |
          url=$(vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN")
          echo "deployed_url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url"
